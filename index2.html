<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HELLO KITTY🐱</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chatbot">

        <!-- Header -->
        <div class="header">
            <div class="cat-face">😾</div>

            <h1>KITTY is available!</h1>

            <p>Talk to me... if you dare.</p>
        </div>


        <!-- Chat -->
        <div class="chat" id="chat">

            <!-- First CatBot message -->
            <div class="message bot-message">
                MRAOW! HSSSS! 😾
            </div>

        </div>


        <!-- Input -->
        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Talk to the angry cat..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script src="./script.js"></script>

</body>

</html>
